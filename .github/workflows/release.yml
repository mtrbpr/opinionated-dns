name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install the aarch64 Linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          target="${{ matrix.target }}"
          name="opinionated-dns-${version}-${target}"
          stage="dist/${name}"
          mkdir -p "$stage"
          bin="opinionated-dns"
          if [ "$target" = "x86_64-pc-windows-msvc" ]; then
            bin="opinionated-dns.exe"
          fi
          cp "target/${target}/release/${bin}" "$stage/${bin}"
          cp config.toml "$stage/config.toml"
          python3 - "$stage" "$bin" <<'PY'
          import hashlib, pathlib, sys, tarfile, zipfile
          stage = pathlib.Path(sys.argv[1])
          binary = sys.argv[2]
          lines = []
          for name in (binary, "config.toml"):
              data = (stage / name).read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              lines.append(f"{digest}  {name}")
          (stage / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          archive_dir = stage.parent
          if binary.endswith(".exe"):
              archive = archive_dir / f"{stage.name}.zip"
              with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
                  for path in sorted(stage.iterdir()):
                      zf.write(path, f"{stage.name}/{path.name}")
          else:
              archive = archive_dir / f"{stage.name}.tar.gz"
              with tarfile.open(archive, "w:gz") as tf:
                  for path in sorted(stage.iterdir()):
                      tf.add(path, arcname=f"{stage.name}/{path.name}")
          print(archive)
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
